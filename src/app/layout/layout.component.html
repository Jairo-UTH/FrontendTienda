<mat-toolbar>
  <span> Tienda Angular </span>

  <span class="toolbar-spacer"></span>

  <a mat-button routerLink="/">
    <mat-icon>home</mat-icon>
    <span>Inicio</span>
  </a>

  <a mat-button routerLink="/cart">
    <mat-icon matBadgeColor="warn"
              [matBadge]="cartService.totalItems()"
              [matBadgeHidden]="cartService.totalItems() === 0">
      shopping_cart
    </mat-icon>

    <span>Carrito</span>
  </a>
  <a mat-button routerLink="/purchase">
    <mat-icon>shopping_bag</mat-icon>
    <span>Compras</span>
  </a>

  @if (authService.isGerente()) {
  <a mat-button routerLink="/newProduct">
    <mat-icon>inventory_2</mat-icon>
    <span>Productos</span>
  </a>

  <a mat-button routerLink="/listEmployee">
    <mat-icon>badge</mat-icon>
    <span>Empleados</span>
  </a>
  }

  @if (authService.isLoggedIn()) {
  <button mat-button (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Salir ({{authService.getFullName()}})</span>
  </button>
  } @else {
  <a mat-button routerLink="/login">
    <mat-icon>login</mat-icon>
    <span>Iniciar sesión</span>
  </a>
  }

</mat-toolbar>


<main class="page-container">

  <router-outlet></router-outlet>

</main>
